    <meta name="description" content="DevOps Software Developer building cloud and AI infrastructure with AWS, Terraform, Docker, and CI/CD pipelines. AWS Solutions Architect Associate certified." />

    <!-- Critical asset preloads. Profile pic + NCAA hero photo + game clip
         all show in the first viewport on mobile (Hero -> NCAA order).
         Preconnect to YouTube/Google Fonts for the desktop background clip. -->
    <link rel="preload" as="image" href="/images/profile/louis-sader.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/ncaa/steeple.webp" type="image/webp" />
    <link rel="preload" as="video" href="/videos/escape-clip.mp4" type="video/mp4" />
    <link rel="preconnect" href="https://www.youtube.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="keywords" content="DevOps Developer, Software Engineer, Python, TypeScript, AWS, Terraform, Docker, Kubernetes, Cloud Infrastructure, AI, Louis Sader" />
    <meta name="author" content="Louis Sader" />
    <link rel="canonical" href="https://louissader.vercel.app/" />

    <!-- Open Graph. og:image is versioned (?v=2) so Slack/Discord/iMessage
         link previewers refetch instead of serving the old cached card. -->
    <meta property="og:title" content="Louis Sader Portfolio Website" />
    <meta property="og:site_name" content="Louis Sader Portfolio Website" />
    <meta property="og:description" content="DevOps Software Developer building cloud and AI infrastructure with AWS, Terraform, Docker, and CI/CD pipelines. AWS Solutions Architect Associate certified. NCAA athlete, six conference titles." />

    <meta property="og:url" content="https://louissader.vercel.app/" />
    <meta property="og:image" content="https://louissader.vercel.app/og-image.png?v=4" />
    <meta property="og:image:secure_url" content="https://louissader.vercel.app/og-image.png?v=4" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Louis Sader Portfolio Website" />
